name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Race (indexer)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/index/ ./internal/store/...

      - name: Release-path build smoke
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          VERSION="ci-smoke"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-s -w \
            -X github.com/keelwright-hq/synapse/internal/buildinfo.Version=${VERSION} \
            -X github.com/keelwright-hq/synapse/internal/buildinfo.Commit=${COMMIT} \
            -X github.com/keelwright-hq/synapse/internal/buildinfo.Date=${DATE}" \
            -o synapse ./cmd/synapse
          ./synapse version | tee version.out
          grep -F "${VERSION}" version.out
          if grep -qE '(^|[[:space:]])dev([[:space:]]|$)' version.out; then
            echo "release-path build still reports Version=dev" >&2
            exit 1
          fi

  # Native-OS cgo smoke. Release binaries are built on matching runners
  # (see .github/workflows/release.yml and docs/tree-sitter.md).
  native-cgo:
    name: Native CGO build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: linux/amd64 (native)
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -o dist/synapse-linux-amd64 ./cmd/synapse
          ls -la dist/
