name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-s -w \
            -X github.com/taricsa/synapse/internal/buildinfo.Version=${VERSION} \
            -X github.com/taricsa/synapse/internal/buildinfo.Commit=${COMMIT} \
            -X github.com/taricsa/synapse/internal/buildinfo.Date=${DATE}" \
            -o synapse ./cmd/synapse
          ./synapse version

  # Native-OS cgo smoke only. Linux→darwin CGO cross-compile is deferred
  # until a dedicated cross-cgo/release pipeline exists (see docs/tree-sitter.md).
  native-cgo:
    name: Native CGO build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: linux/amd64 (native)
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -o dist/synapse-linux-amd64 ./cmd/synapse
          ls -la dist/
